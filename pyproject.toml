[project]
name = "mulsen-baseline-pilot"
version = "0.1.0"
description = "Minimal MulSen-AD cross-modal anomaly-detection pilot."
requires-python = ">=3.8,<3.9"
dependencies = [
  "matplotlib==3.5.3",
  "numpy==1.21.5",
  "pandas==1.3.5",
  "Pillow==9.5.0",
  "PyYAML==6.0.1",
  "scikit-learn==1.0.2",
  "scipy==1.7.3",
  "tqdm==4.66.1",
]

[dependency-groups]
dev = [
  "pytest==7.4.4",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
